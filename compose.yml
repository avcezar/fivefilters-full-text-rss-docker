services:
  fullfeedrss:
    build: .
    image: fivefilters-full-text-rss:latest
    mem_limit: 2G
    restart: always
    environment:
      # Leave empty to disable admin section
      - FTR_ADMIN_PASSWORD=
    volumes:
      - "rss-cache:/var/www/html/cache/rss"
      - "./custom:/var/www/html/site_config/custom"
    # Public resolvers, and the image fetches over IPv4. A Linux server
    # often has working host DNS but a container that tries IPv6 and fails.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8080:80"
volumes:
  rss-cache:
